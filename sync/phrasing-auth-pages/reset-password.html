<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set a new password</title>
    <link rel="stylesheet" href="./auth-pages.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <main>
      <h1>Set a new password</h1>
      <p id="intro">Checking your password-reset link.</p>

      <form id="passwordForm" hidden>
        <label>
          New password
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>
          Confirm password
          <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit">Update password</button>
      </form>

      <a id="continue" class="button-link" hidden>Continue to editor</a>
      <p id="message" class="message" aria-live="polite"></p>
    </main>

    <script type="module">
      import {
        configurePhrasingSync,
        getCurrentUser,
        isPasswordRecoveryCallback,
        onAuthStateChange,
        setPassword
      } from '../phrasing-supabase-sync.js';

      // Replace these values when copying this template into the editor repo.
      const EDITOR_URL = 'https://YOUR_GITHUB_USERNAME.github.io/YOUR_EDITOR_REPO/';
      configurePhrasingSync({
        supabaseUrl: 'https://YOUR_PROJECT_REF.supabase.co',
        supabaseAnonKey: 'YOUR_SUPABASE_ANON_PUBLIC_KEY',
        redirectTo: EDITOR_URL
      });

      const intro = document.getElementById('intro');
      const form = document.getElementById('passwordForm');
      const password = document.getElementById('password');
      const passwordConfirm = document.getElementById('passwordConfirm');
      const message = document.getElementById('message');
      const continueLink = document.getElementById('continue');
      let recoveryEventSeen = isPasswordRecoveryCallback();

      function showMessage(text, isError = false) {
        message.textContent = text;
        message.classList.toggle('error', isError);
      }

      async function refresh() {
        const user = await getCurrentUser();
        if (!recoveryEventSeen || !user) {
          intro.textContent = 'This password-reset link is invalid or has expired. Request a new reset email from the editor.';
          form.hidden = true;
          return;
        }
        intro.textContent = 'Choose a new password for your account.';
        form.hidden = false;
        password.focus();
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        if (password.value !== passwordConfirm.value) {
          showMessage('The passwords do not match.', true);
          return;
        }
        const button = form.querySelector('button');
        button.disabled = true;
        showMessage('');
        const result = await setPassword({ password: password.value });
        button.disabled = false;

        if (!result.ok) {
          showMessage('We could not update your password. Request a new reset email and try again.', true);
          return;
        }
        password.value = '';
        passwordConfirm.value = '';
        form.hidden = true;
        intro.textContent = 'Your password has been updated.';
        continueLink.href = EDITOR_URL;
        continueLink.hidden = false;
        showMessage('You can now return to the editor.');
      });

      onAuthStateChange(function (event) {
        if (event === 'PASSWORD_RECOVERY') recoveryEventSeen = true;
        refresh();
      });
      refresh();
    </script>
  </body>
</html>
